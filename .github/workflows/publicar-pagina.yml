# Publica la página en GitHub Pages cada vez que algo llega a main.
# GitHub instala las librerías, compila con Vite y sube la carpeta dist/ (nadie tiene que subirla a mano).
# Requisito, una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar la página

on:
  push:
    branches: [main]
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # si llegan dos cambios seguidos, solo se publica el último
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grietas-bajo-la-piel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: grietas-bajo-la-piel/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: grietas-bajo-la-piel/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
